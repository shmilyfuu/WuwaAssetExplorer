name: build

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/WuwaAssetExplorer.App/WuwaAssetExplorer.App.csproj -r win-x64

      - name: Build
        run: dotnet build src/WuwaAssetExplorer.App/WuwaAssetExplorer.App.csproj -c Release -r win-x64 --no-restore -p:Platform=x64

      - name: Publish portable folder
        run: dotnet publish src/WuwaAssetExplorer.App/WuwaAssetExplorer.App.csproj -c Release -r win-x64 --no-restore -p:Platform=x64 -p:PublishProfile=win-x64

      - name: Verify deployment layout
        shell: pwsh
        run: |
          $dist = Resolve-Path 'artifacts/publish/win-x64'
          $exe = Join-Path $dist 'WuwaAssetExplorer.exe'
          $pri = Join-Path $dist 'resources.pri'

          if (!(Test-Path $exe)) { throw 'WuwaAssetExplorer.exe is missing from publish output.' }
          if (!(Test-Path $pri)) { throw 'resources.pri is missing from publish output.' }

          $localWinUiRuntime = @(Get-ChildItem $dist -File -Filter 'Microsoft.UI.Xaml.dll' -ErrorAction SilentlyContinue)
          if ($localWinUiRuntime.Count -ne 0) {
            throw 'Framework-dependent publish unexpectedly contains Microsoft.UI.Xaml.dll. Check WindowsAppSDKSelfContained overrides.'
          }

          $files = @(Get-ChildItem $dist -File -Recurse)
          $bytes = ($files | Measure-Object Length -Sum).Sum
          Write-Host "Publish files: $($files.Count)"
          Write-Host ("Publish size: {0:N2} MiB" -f ($bytes / 1MB))
          Get-ChildItem $dist -File | Sort-Object Name | Select-Object Name,Length | Format-Table -AutoSize

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: WuwaAssetExplorer-win-x64
          path: artifacts/publish/win-x64/
          if-no-files-found: error
