name: WuwaTappo macOS TLS trial

on:
  push:
    branches:
      - build/wuwatappo-macos-tls-20261117

permissions:
  contents: read

jobs:
  build:
    name: Build native TLS DMG
    runs-on: macos-15
    timeout-minutes: 60
    env:
      WUWA_REGION: cn
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Fetch pinned upstream release
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/alexzhong233/WuwaTappo-Full-Community.git source
          test "$(git -C source rev-parse HEAD)" = "9ccc18a5763fefea62d33399eb0a1d3aa2635830"
      - name: Select macOS native TLS backend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/macos/src-tauri/Cargo.toml")
          s = p.read_text()
          old = 'tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }'
          new = 'tokio-tungstenite = { version = "=0.26.2", default-features = false, features = ["connect", "native-tls"] }'
          assert s.count(old) == 1, "Unexpected upstream TLS dependency; stop."
          p.write_text(s.replace(old, new))
          print("Mac native TLS selected for tokio-tungstenite 0.26.2")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install macOS build tools
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          brew install sevenzip osslsigncode
          cargo metadata --manifest-path source/macos/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - uses: actions/cache@v4
        with:
          path: source/macos/.work/installers
          key: wuwatappo-cn-installer-1.0.4-eb4e6d2103c222297508837a5ca92eeaa058891c9f1e2e7bf034c23f37668e26
      - name: Install dependencies
        working-directory: source
        run: npm ci
      - name: Prepare verified official CN frontend
        working-directory: source
        run: |
          for attempt in 1 2 3; do
            if npm run setup; then
              exit 0
            fi
            echo "Official CDN download attempt $attempt failed."
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 8
          done
      - name: Preserve safe native WebSocket failure reasons in app log
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/macos/scripts/mac-websocket.js')
          s = p.read_text()
          anchor = '  const encoder = new TextEncoder();'
          helper = r"""
            function socketFailureCode(error) {
              const message = String(error?.message ?? error ?? '');
              const http = /^WebSocket handshake rejected \\(HTTP (\\d{3})\\)$/.exec(message);
              if (http) return 'http_' + http[1];
              if (message === 'WebSocket TLS connection failed') return 'tls';
              if (message === 'WebSocket network connection failed') return 'network';
              if (message === 'WebSocket protocol connection failed') return 'protocol';
              if (message === 'WebSocket connection timed out') return 'timeout';
              if (message === 'WebSocket closed before connecting') return 'closed_before_connect';
              if (message.includes('本地全图鉴开启时不能连接联机房间')) return 'local_atlas_block';
              if (message.includes("Only the current region's official WebSocket endpoint")) return 'endpoint_validation';
              if (message.includes('WebSocket access requires a trusted app window')) return 'caller_validation';
              if (message.includes('WebSocket id already exists')) return 'duplicate_socket';
              if (message.includes('WebSocket state is unavailable')) return 'socket_state';
              if (message.includes('Native WebSocket bridge is unavailable')) return 'missing_native_bridge';
              return 'unknown';
            }
            function logSocketFailure(stage, error) {
              const code = socketFailureCode(error);
              window.__TAURI__?.core?.invoke('write_app_log', {
                level: 'error', message: '[NATIVE_WS] stage=' + stage + ' reason=' + code
              }).catch(() => {});
            }
          """.strip('\n')
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + '\n' + helper, 1)
          old = 'this.#queue = this.#creation.catch(() => this.#fail());'
          new = 'this.#queue = this.#creation.catch(error => { logSocketFailure("connect_invoke", error); this.#fail(); });'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = "        console.warn('[macOS] WebSocket connection failed:', event.message);"
          new = "        logSocketFailure('socket_event', event.message);\n" + old
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check source/macos/scripts/mac-websocket.js
      - name: Run macOS frontend and native tests
        working-directory: source
        run: |
          npm test
          npm run test:fullatlas
          npm run test:rust
      - name: Build macOS application
        working-directory: source
        run: npm run build -- -- --locked
      - name: Verify and package DMG
        working-directory: source
        run: |
          npm run package
          shasum -a 256 dist/*.dmg > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WuwaTappo-Full-CN-Community-1.3.1-macOS-arm64-socket-diagnostics
          path: |
            source/dist/*.dmg
            source/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
